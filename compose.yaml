name: nuance
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm dev:env}
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm dev:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm dev:env}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run pnpm dev:env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run pnpm dev:env}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio_data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    volumes: ['mail_data:/data']
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SMTP_HOST: mailpit
      S3_ENDPOINT: http://minio:9000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  minio_data:
  mail_data:
